services:
  user-service:
    build: ./user-service
    image: user-service:1.0
    restart: unless-stopped
    environment:
      PORT: "3001"
      SERVICE_NAME: "user-service"
    expose:
      - "3001"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3

  product-service:
    build: ./product-service
    image: product-service:1.0
    restart: unless-stopped
    environment:
      PORT: "3002"
      SERVICE_NAME: "product-service"
    expose:
      - "3002"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3002/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3

  order-service:
    build: ./order-service
    image: order-service:1.0
    restart: unless-stopped
    environment:
      PORT: "3003"
      SERVICE_NAME: "order-service"
    expose:
      - "3003"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3003/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      user-service:
        condition: service_healthy
      product-service:
        condition: service_healthy
      order-service:
        condition: service_healthy
